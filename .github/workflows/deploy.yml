# Reusable: builds the api and web images, pushes them to GHCR and deploys them on the VPS
# with docker compose (deploy/docker-compose.yaml). Called by recette.yml and prod.yml.
#
# With `deploy: false` (pull requests) the images are only built, to check the Dockerfiles.
#
# Per GitHub environment (Settings > Environments > recette | production):
#   secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY, SSH_PASSPHRASE (optional), GHCR_TOKEN (PAT read:packages)
#   vars:    DEPLOY_PATH (e.g. /opt/kodinga/recette), WEB_PORT (e.g. 8082), API_PORT (e.g. 8092)
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment, also the moving image tag (recette | production)
        type: string
        required: true
      site-url:
        description: Public origin of the front (e.g. https://recette.kodinga.com), baked into the web image
        type: string
        required: false
        default: ''
      api-url:
        description: Public origin of the api (e.g. https://api.recette.kodinga.com). Empty = same origin as the front
        type: string
        required: false
        default: ''
      deploy:
        description: Push the images and deploy (false = build only)
        type: boolean
        required: true

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry-path: ${{ steps.meta.outputs.registry-path }}
    steps:
      # These URLs come from *repository* variables: the caller reads them before entering the
      # GitHub environment, so environment-level variables are invisible at that point.
      - name: Check deploy settings
        if: inputs.deploy
        env:
          SITE_URL: ${{ inputs.site-url }}
          API_URL: ${{ inputs.api-url }}
        run: |
          missing=""
          [ -n "$SITE_URL" ] || missing="$missing site-url"
          [ -n "$API_URL" ] || missing="$missing api-url"
          if [ -n "$missing" ]; then
            echo "::error::Empty input(s):$missing. Create RECETTE_SITE_URL / RECETTE_API_URL (or PROD_*) under Settings > Secrets and variables > Actions > Variables > *Repository* variables (not in the environment)."
            exit 1
          fi
          echo "Front: $SITE_URL | Api: $API_URL"

      - uses: actions/checkout@v7

      - name: Image name and tag
        id: meta
        run: |
          # GHCR image names must be lowercase
          echo "registry-path=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.environment }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Pushing uses the workflow token: no personal token needed on the CI side
      - name: Log in to GHCR
        if: inputs.deploy
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build contexts: web needs the repo root (package.json, nx, libs/ui),
      # api is self-contained in apps/api (its Dockerfile copies pyproject.toml from the context root)
      - name: Build ${{ matrix.app }}${{ inputs.deploy && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app == 'api' && 'apps/api' || '.' }}
          file: apps/${{ matrix.app }}/Dockerfile
          # Only the web Dockerfile declares these (the api build just ignores them)
          build-args: |
            VITE_SITE_URL=${{ inputs.site-url }}
            VITE_API_URL=${{ inputs.api-url && format('{0}/api/v1/', inputs.api-url) || '' }}
          push: ${{ inputs.deploy }}
          # Immutable tag (rollback) + moving tag per environment
          tags: |
            ${{ steps.meta.outputs.registry-path }}/${{ matrix.app }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.registry-path }}/${{ matrix.app }}:${{ inputs.environment }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    if: inputs.deploy
    needs: images
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.site-url }}
    # Never run two deployments of the same environment at once, never cancel one midway
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Copy the compose file to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: deploy/docker-compose.yaml
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1

      - name: Pull and restart the stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PROJECT: kodinga-${{ inputs.environment }}
          REGISTRY_PATH: ${{ needs.images.outputs.registry-path }}
          IMAGE_TAG: ${{ needs.images.outputs.tag }}
          WEB_PORT: ${{ vars.WEB_PORT }}
          API_PORT: ${{ vars.API_PORT }}
          SITE_URL: ${{ inputs.site-url }}
          API_URL: ${{ inputs.api-url }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DEPLOY_PATH,PROJECT,REGISTRY_PATH,IMAGE_TAG,WEB_PORT,API_PORT,SITE_URL,API_URL,GHCR_USER,GHCR_TOKEN
          script: |
            # No `script_stop` option: it checks $? after every line and silently exits on any
            # non-zero test (e.g. a health check attempt that is not 200 yet). set -eu is enough.
            set -eu
            cd "$DEPLOY_PATH"
            test -f api.env || { echo "Missing $DEPLOY_PATH/api.env (see deploy/api.env.example)"; exit 1; }

            # Compose interpolation values (api.env holds the app secrets)
            {
              # Explicit: compose would pick a stray compose.yaml before docker-compose.yaml
              echo "COMPOSE_FILE=docker-compose.yaml"
              echo "API_IMAGE=$REGISTRY_PATH/api"
              echo "WEB_IMAGE=$REGISTRY_PATH/web"
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "WEB_PORT=${WEB_PORT:-8081}"
              echo "API_PORT=${API_PORT:-8091}"
            } > .env

            # stdin: the token never shows up in logs or in the process list
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -p "$PROJECT" pull
            docker compose -p "$PROJECT" up -d --remove-orphans
            docker logout ghcr.io
            # Each deploy has its own tag: drop unused images older than a week (keeps recent rollbacks local)
            docker image prune -af --filter "until=168h"

            # Smoke tests sending the real domains as Host, like a visitor would
            # (each domain must be listed in ALLOWED_HOSTS of api.env for the api).
            host_of() { h="${1#*://}"; echo "${h%%/*}"; }
            SITE_HOST=$(host_of "$SITE_URL")
            API_HOST=$(host_of "$API_URL")
            if [ -n "$API_HOST" ]; then
              CHECK_HOST="$API_HOST"
              HEALTH_URL="http://127.0.0.1:${API_PORT:-8091}/api/v1/health/"
            else
              # No api subdomain: the api is reached through the web container (/api)
              CHECK_HOST="$SITE_HOST"
              HEALTH_URL="http://127.0.0.1:${WEB_PORT:-8081}/api/v1/health/"
            fi

            code=000
            for i in $(seq 1 20); do
              code=$(curl -s -o /tmp/kodinga-health.txt -w '%{http_code}' ${CHECK_HOST:+-H "Host: $CHECK_HOST"} "$HEALTH_URL" || true)
              if [ "$code" = "200" ]; then
                break
              fi
              echo "Api health check $i/20: HTTP $code"
              sleep 5
            done

            if [ "$code" = "200" ]; then
              # The front is static: one request is enough once the api is up
              web_code=$(curl -s -o /dev/null -w '%{http_code}' ${SITE_HOST:+-H "Host: $SITE_HOST"} "http://127.0.0.1:${WEB_PORT:-8081}/" || true)
              if [ "$web_code" = "200" ]; then
                echo "Deployed $IMAGE_TAG"
                exit 0
              fi
              echo "Front check failed: HTTP $web_code on port ${WEB_PORT:-8081}"
              docker compose -p "$PROJECT" ps
              docker compose -p "$PROJECT" logs --tail=40 web
              exit 1
            fi

            echo "Api health check failed for $IMAGE_TAG (Host sent: ${CHECK_HOST:-none, the *_SITE_URL / *_API_URL variables are empty})"
            echo "--- last response:"
            head -c 300 /tmp/kodinga-health.txt; echo
            if [ "$code" = "400" ]; then
              echo "--- HTTP 400 usually means DisallowedHost: add '${CHECK_HOST:-the domain}' to ALLOWED_HOSTS in $DEPLOY_PATH/api.env"
              docker compose -p "$PROJECT" logs --tail=200 api | grep -i "Invalid HTTP_HOST" | tail -3 || true
            fi
            docker compose -p "$PROJECT" ps
            docker compose -p "$PROJECT" logs --tail=60 api
            exit 1
