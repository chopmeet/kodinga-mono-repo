name: build (Recette)

on:
  push:
    branches:
      - recette
  pull_request:
    branches:
      - recette

# A newer push on the same branch/PR cancels the run in progress
concurrency:
  group: recette-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      
      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Agents and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#nx-cloud-start-nx-agents
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: npx nx start-nx-agents

      
      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
       
      - run: npm ci

      # Python toolchain for the Django api (version read from apps/api/.python-version)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/api/uv.lock'

      - run: uv sync --directory apps/api --locked

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- echo Hello World
      - run: npx nx run-many -t lint test build
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      # Requires Nx Cloud: run "nx connect" then uncomment
      # - run: npx nx fix-ci
      #   if: always()

  # Images + deploy once the checks pass. Pull requests only build the images (no push, no deploy).
  deploy:
    needs: main
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: recette
      site-url: ${{ vars.RECETTE_SITE_URL }}
      api-url: ${{ vars.RECETTE_API_URL }}
      deploy: ${{ github.event_name == 'push' }}
    secrets: inherit
