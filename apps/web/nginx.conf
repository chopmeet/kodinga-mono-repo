# Keep the scheme sent by the host reverse proxy (https), fall back to ours when called directly
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. With a variable in proxy_pass, nginx re-resolves `api` (every 10s)
  # instead of keeping the IP it saw at startup: no 502 when the api container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  set $asgi_upstream http://asgi:8001;

  # Django: API and its static files (served by whitenoise). Not /admin/: that path belongs to the
  # SPA admin (/admin/dashboard...); the Django admin stays on the api domain (api.kodinga.com/admin/)
  location ~ ^/(api|static)/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Realtime WebSockets: Daphne ASGI server
  location /ws/ {
    proxy_pass $asgi_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Hashed Vite assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router: unknown paths fall back to the SPA
  location / {
    try_files $uri /index.html;
  }
}
