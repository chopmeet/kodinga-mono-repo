<!DOCTYPE html>
<!-- lang is kept in sync with the selected language at runtime (src/utils/i18n.ts) -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />

    <title>Kodinga · Trouvez votre communauté tech</title>
    <meta
      name="description"
      content="Kodinga réunit les développeurs africains en guildes par stack : formations, sessions live, entraide et mentorat avec les meilleurs ingénieurs du continent."
    />
    <meta name="application-name" content="Kodinga" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme before React draws (same key and rule as ThemeProvider in src/main.tsx): no white flash in dark mode -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kodinga-theme');
          var dark = stored === 'dark' || ((!stored || stored === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kodinga" />
    <meta property="og:title" content="Kodinga · Trouvez votre communauté tech africaine" />
    <meta
      property="og:description"
      content="Guildes par stack, formations, sessions live et mentorat avec les meilleurs ingénieurs du continent."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kodinga : trouvez votre communauté tech africaine." />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kodinga · Trouvez votre communauté tech africaine" />
    <meta
      name="twitter:description"
      content="Guildes par stack, formations, sessions live et mentorat avec les meilleurs ingénieurs du continent."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <noscript>Kodinga a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
