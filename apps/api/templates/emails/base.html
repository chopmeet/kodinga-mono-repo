<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{ subject|default:app_name }}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Base Resets */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* Container & Layout */
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f1f5f9;
            padding: 40px 0 40px 0;
        }
        .main-card {
            background-color: #ffffff;
            margin: 0 auto;
            max-width: 600px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 32px 40px 24px 40px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
            background-color: #ffffff;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            text-decoration: none;
            letter-spacing: -0.5px;
            display: inline-block;
        }
        .logo-dot {
            color: #4f46e5;
        }
        .badge-header {
            float: right;
            background-color: #eef2ff;
            color: #4f46e5;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Content */
        .content {
            padding: 36px 40px;
            color: #334155;
            font-size: 15px;
            line-height: 1.65;
        }
        h1, h2, h3 {
            color: #0f172a;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }
        h2 {
            font-size: 20px;
            line-height: 1.3;
        }
        p {
            margin: 0 0 16px 0;
            color: #334155;
            font-size: 15px;
        }

        /* Buttons */
        .btn-wrapper {
            margin: 32px 0;
            text-align: center;
        }
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            background-color: #4f46e5;
            color: #ffffff !important;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
            letter-spacing: 0.2px;
        }

        /* Callout / Fallback Box */
        .callout-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px 20px;
            margin: 24px 0 0 0;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }
        .link-text {
            word-break: break-all;
            color: #4f46e5;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
        }

        /* Alerts & Warnings */
        .alert-box-warning {
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
            border-radius: 6px;
            padding: 16px 20px;
            margin: 24px 0;
        }
        .alert-title-warning {
            color: #991b1b;
            font-weight: 600;
            margin: 0 0 6px 0;
            font-size: 14px;
        }
        .alert-desc-warning {
            color: #7f1d1d;
            font-size: 13px;
            margin: 0;
            line-height: 1.5;
        }

        /* Footer */
        .footer {
            padding: 24px 40px;
            background-color: #f8fafc;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .footer p {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #64748b;
        }
        .footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        @media screen and (max-width: 600px) {
            .wrapper { padding: 12px !important; }
            .header { padding: 24px 20px !important; }
            .content { padding: 28px 20px !important; }
            .footer { padding: 20px !important; }
            .btn-primary { display: block !important; width: auto !important; padding: 14px 20px !important; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
                <td align="center">
                    <div class="main-card">
                        <!-- Header -->
                        <div class="header">
                            <a href="{{ frontend_url }}" class="logo">
                                {{ app_name }}<span class="logo-dot">.</span>
                            </a>
                            <span class="badge-header">Dev Platform</span>
                        </div>

                        <!-- Content Area -->
                        <div class="content">
                            {% block content %}{% endblock %}
                        </div>

                        <!-- Footer -->
                        <div class="footer">
                            <p>&copy; 2026 <strong>{{ app_name }}</strong>. Tous droits réservés.</p>
                            <p>Des questions ou un besoin d'assistance ? Contactez notre support technique : <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
