[tool.coverage.run]
branch = true
source = [ "api", "apps", "common" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
norecursedirs = [".venv", "venv", "dist", "scratch", ".git"]
addopts = "-v --reuse-db"

[project]
name = "api"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.9,<4"
readme = 'README.md'
dependencies = [
    "django>=4.2.30",
    "django-environ>=0.12",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "drf-spectacular>=0.27.0",
    "django-cors-headers>=4.3.0",
    "django-filter>=24.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.13",
    "whitenoise>=6.11.0",
    "resend>=2.49.0",
    "google-genai>=1.47.0",
    "openai>=2.48.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "apps", "common"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-django>=4.8.0",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = ["E501"]

fixable = ["ALL"]
unfixable = []
