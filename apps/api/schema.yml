openapi: 3.0.3
info:
  title: Kodinga Platform API
  version: 1.0.0
  description: "High-performance, multi-tenant developer community SaaS backend API.\n\n###
    \U0001F510 Guide d'Authentification sur Swagger\n1. Exécutez `POST /api/v1/auth/login/`
    ou `POST /api/v1/auth/register/`.\n2. Copiez la valeur du champ `access` (ex:
    `eyJhbGciOi...`).\n3. Cliquez sur le bouton vert **Authorize** en haut à droite.\n4.
    Collez votre token (ou `Bearer <token>`) et cliquez sur **Authorize**.\n5. Vous
    pouvez désormais tester tous les endpoints protégés (`GET /api/v1/users/me/`,
    etc.)."
paths:
  /api/v1/auth/{provider}/callback/:
    post:
      operationId: auth_callback_create
      description: Exchanges provider authorization code for tokens, resolves user
        profile, links identity, and returns JWT credentials.
      summary: Process OAuth authorization code callback
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - OAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Successfully authenticated via OAuth
        '400':
          description: OAuth token exchange or profile verification failed
  /api/v1/auth/{provider}/start/:
    get:
      operationId: auth_start_retrieve
      description: Generates a secure OAuth authorization URL with anti-CSRF state
        token for Google or GitHub.
      summary: Initialize OAuth Authorization URL
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - OAuth
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Authorization URL and generated state
        '400':
          description: Unsupported OAuth provider
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Validates user credentials, creates a new session record, and returns
        Access & Refresh JWTs.
      summary: Authenticate user and issue JWT tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Successful login with JWT credentials and user payload
        '401':
          description: Invalid email or password
        '403':
          description: Account is disabled
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token and invalidates current device
        session.
      summary: Log out current session
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Successfully logged out
        '401':
          description: Authentication required
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: Revokes all active sessions and blacklists all outstanding refresh
        tokens for the user.
      summary: Log out from all devices / revoke all sessions
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: All sessions successfully revoked
        '401':
          description: Authentication required
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Validates current password and sets a new password for the currently
        logged-in user.
      summary: Change password for authenticated user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: Password updated successfully
        '400':
          description: Validation or current password error
        '401':
          description: Authentication required
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Sends a single-use password reset link to the email. Returns 200
        regardless of existence to prevent enumeration.
      summary: Request password reset instructions
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Instructions sent successfully if account exists
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Validates the reset token, updates password, and revokes all active
        sessions.
      summary: Confirm password reset with token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Password reset successfully
        '400':
          description: Invalid or expired reset token
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates a new user account, stores legal consents, and sends an
        email verification link.
      summary: Register a new developer account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Account successfully registered
        '400':
          description: Validation error or duplicate credentials
  /api/v1/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: Dispatches a new verification token to the specified email if unverified.
        Always returns 200 to prevent user enumeration.
      summary: Resend email verification link
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Generic confirmation response
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_retrieve
      description: Returns a list of all active sessions and authorized devices for
        the current user.
      summary: List active user sessions
      tags:
      - Sessions
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: Active sessions retrieved
        '401':
          description: Authentication required
  /api/v1/auth/sessions/{session_id}/:
    delete:
      operationId: auth_sessions_destroy
      description: Explicitly terminates a session by UUID and invalidates its refresh
        token.
      summary: Revoke a specific user session
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Sessions
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: Session successfully revoked
        '401':
          description: Authentication required
        '404':
          description: Session not found
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Validates a single-use token and marks the associated user email
        as verified.
      summary: Verify account email address
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Email verified successfully
        '400':
          description: Invalid or expired verification token
  /api/v1/users/me/:
    get:
      operationId: users_me_retrieve
      description: Fetches the complete user profile and verification status of the
        authenticated account.
      summary: Retrieve logged-in user profile
      tags:
      - Users
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Profile data retrieved
        '401':
          description: Authentication required
    patch:
      operationId: users_me_partial_update
      description: Updates personal details such as first name, last name, language,
        or timezone.
      summary: Update profile details
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Profile updated successfully
        '400':
          description: Validation error
        '401':
          description: Authentication required
  /api/v1/users/me/consents/:
    post:
      operationId: users_me_consents_create
      description: Logs explicit user consent for GDPR, Terms of Service, or privacy
        policy updates.
      summary: Record user legal consent
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
          description: Consent recorded successfully
        '400':
          description: Validation error
        '401':
          description: Authentication required
components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - confirm_password
      - current_password
      - new_password
    Consent:
      type: object
      description: Standard base serializer automatically making audit and primary
        key fields read-only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        consent_type:
          type: string
          description: Consent identifier (e.g. 'terms_of_service', 'privacy_policy').
          maxLength: 100
        policy_version:
          type: string
          description: Version string of the policy accepted.
          maxLength: 50
        granted:
          type: boolean
          description: Indicates whether consent was granted (True) or revoked (False).
        recorded_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when consent was recorded.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - consent_type
      - created_at
      - id
      - policy_version
      - recorded_at
    ConsentRequest:
      type: object
      description: Standard base serializer automatically making audit and primary
        key fields read-only.
      properties:
        consent_type:
          type: string
          minLength: 1
          description: Consent identifier (e.g. 'terms_of_service', 'privacy_policy').
          maxLength: 100
        policy_version:
          type: string
          minLength: 1
          description: Version string of the policy accepted.
          maxLength: 50
        granted:
          type: boolean
          description: Indicates whether consent was granted (True) or revoked (False).
      required:
      - consent_type
      - policy_version
    EmailVerificationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 10
      required:
      - token
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        device_name:
          type: string
          default: ''
          maxLength: 255
      required:
      - email
      - password
    OAuthCallbackRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        state:
          type: string
          default: ''
      required:
      - code
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 10
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - confirm_password
      - new_password
      - token
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedUserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          description: User's first name.
          maxLength: 150
        last_name:
          type: string
          description: User's last name.
          maxLength: 150
        preferred_language:
          type: string
          minLength: 1
          description: Preferred language code for emails and interface (e.g. 'fr',
            'en').
          maxLength: 10
        timezone:
          type: string
          minLength: 1
          description: User's primary timezone.
          maxLength: 50
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          default: ''
          maxLength: 150
        last_name:
          type: string
          default: ''
          maxLength: 150
        preferred_language:
          type: string
          minLength: 1
          default: fr
          maxLength: 10
        timezone:
          type: string
          minLength: 1
          default: UTC
          maxLength: 50
        terms_accepted:
          type: boolean
          default: true
      required:
      - email
      - password
      - username
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      description: Standard base serializer automatically making audit and primary
        key fields read-only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          description: User's unique primary email address (case-insensitive).
        username:
          type: string
          readOnly: true
          description: Unique public handle/username (case-insensitive).
        first_name:
          type: string
          description: User's first name.
          maxLength: 150
        last_name:
          type: string
          description: User's last name.
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: Designates whether this user account is active.
        is_email_verified:
          type: boolean
          readOnly: true
        preferred_language:
          type: string
          description: Preferred language code for emails and interface (e.g. 'fr',
            'en').
          maxLength: 10
        timezone:
          type: string
          description: User's primary timezone.
          maxLength: 50
        date_joined:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the user registered.
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp of last successful login.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - is_email_verified
      - last_login
      - updated_at
      - username
    UserSession:
      type: object
      description: Standard base serializer automatically making audit and primary
        key fields read-only.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_name:
          type: string
          readOnly: true
          description: Device name or parsed user-agent header.
        ip_address:
          type: string
          readOnly: true
          nullable: true
          description: Client IP address recorded during session creation/access.
        user_agent:
          type: string
          readOnly: true
          description: Raw client User-Agent string.
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the session was last active.
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the refresh token / session expires.
        is_active:
          type: boolean
          readOnly: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when the session was explicitly revoked.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device_name
      - expires_at
      - id
      - ip_address
      - is_active
      - last_seen_at
      - revoked_at
      - user_agent
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentication
  description: User registration, login, JWT refresh, logout, password recovery.
- name: Sessions
  description: Active devices, session audit, and token revocations.
- name: OAuth
  description: Third-party single sign-on (Google, GitHub).
- name: Users
  description: Authenticated user profiles and legal consents.
