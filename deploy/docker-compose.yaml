# Kodinga stack deployed on the VPS by .github/workflows/deploy.yml (images from GHCR, nothing is built here).
#
# Files expected next to this one on the VPS (see deploy/README.md):
#   .env      generated at each deploy: image names/tag, port, profiles (compose interpolation)
#   api.env   created once by hand: Django secrets & settings (see api.env.example)
#
# Recette and prod can share a VPS: each runs as its own compose project (-p kodinga-recette / kodinga-production),
# so no fixed container_name here.

x-api: &api
  image: ${API_IMAGE}:${IMAGE_TAG}
  restart: unless-stopped
  env_file: api.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media:/app/media

services:
  web:
    image: ${WEB_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    # Published on localhost only: the host reverse proxy (nginx) handles the domains and TLS.
    # Front domain (recette.kodinga.com) -> this port. nginx inside the image still proxies
    # /api, /admin and /static to `api` (same-origin fallback).
    ports:
      - '127.0.0.1:${WEB_PORT:-8081}:80'
    depends_on:
      - api
      - asgi

  api:
    <<: *api
    ports:
      - '127.0.0.1:${API_PORT:-8091}:8000'
    environment:
      MIGRATE_ON_BOOT: 'true'

  asgi:
    <<: *api
    command: ['daphne', '-b', '0.0.0.0', '-p', '8001', 'config.asgi:application']
    ports:
      - '127.0.0.1:${ASGI_PORT:-8093}:8001'
    environment:
      MIGRATE_ON_BOOT: 'false'

  celery_worker:
    <<: *api
    command: ['celery', '-A', 'config', 'worker', '--loglevel=INFO', '--concurrency=2']
    environment:
      MIGRATE_ON_BOOT: 'false'
    # The image's HEALTHCHECK curls the HTTP api: meaningless for Celery
    healthcheck:
      disable: true

  celery_beat:
    <<: *api
    # /app is read-only for the non-root user: keep the schedule file in /tmp
    command: ['celery', '-A', 'config', 'beat', '--loglevel=INFO', '--schedule=/tmp/celerybeat-schedule']
    environment:
      MIGRATE_ON_BOOT: 'false'
    healthcheck:
      disable: true
    volumes: []

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # POSTGRES_DB/USER/PASSWORD come from api.env and must match DATABASE_URL.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: api.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  media:
  redis_data:
  postgres_data:
