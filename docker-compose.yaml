# Production-like stack: http://localhost
#   docker compose up --build
# Dev only needs the database (the api runs with `npx nx serve api`):
#   docker compose -p kodinga up -d kodingadb
name: kodinga

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_started
      asgi:
        condition: service_started

  api:
    build:
      # The api Dockerfile expects apps/api as context (COPY pyproject.toml ...)
      context: apps/api
    env_file: apps/api/.env
    environment:
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-kodinga}:${POSTGRES_PASSWORD:-kodinga}@kodingadb:5432/${POSTGRES_DB:-kodinga}
      REDIS_CHANNEL_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/1
    depends_on:
      kodingadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  asgi:
    build:
      context: apps/api
    command: ['daphne', '-b', '0.0.0.0', '-p', '8001', 'config.asgi:application']
    env_file: apps/api/.env
    environment:
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-kodinga}:${POSTGRES_PASSWORD:-kodinga}@kodingadb:5432/${POSTGRES_DB:-kodinga}
      REDIS_CHANNEL_URL: redis://redis:6379/2
      REDIS_CACHE_URL: redis://redis:6379/1
      MIGRATE_ON_BOOT: 'false'
    ports:
      - '127.0.0.1:8001:8001'
    depends_on:
      kodingadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  kodingadb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kodinga}
      POSTGRES_USER: ${POSTGRES_USER:-kodinga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodinga}
    ports:
      # Local machine only: the dev api reaches it on localhost:5432
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redis_data:
